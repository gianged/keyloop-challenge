[package]
name = "keyloop-challenge"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-util = "0.7"

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id"] }

utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["vendored", "axum"] }

sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "chrono"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0"
serde_json = "1.0"
