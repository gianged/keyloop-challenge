name: keyloop-scheduler

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-keyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keyloop}
      POSTGRES_DB: ${POSTGRES_DB:-keyloop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keyloop}:${POSTGRES_PASSWORD:-keyloop}@db:5432/${POSTGRES_DB:-keyloop}
      BIND_ADDR: 0.0.0.0:8080
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SLOT_STEP_MINUTES: ${SLOT_STEP_MINUTES:-30}
      LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-2000}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
